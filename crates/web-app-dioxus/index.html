<!DOCTYPE html>
<html lang="en">
    <head>
        <title>{app_title}</title>
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
        <link rel="manifest" href="/manifest.json" />
        <!-- {{PRELOADS}} -->
        <meta charset="utf-8" />
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="theme-color" content="#48C774" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // Apply the configured theme before the first paint, so that the splash screen is
            // not shown in the system color scheme when a different theme is configured
            try {
                const theme = JSON.parse(localStorage.getItem("settings") || "{}").theme;
                if (theme === "Light" || theme === "Dark") {
                    document.documentElement.setAttribute("data-theme", theme.toLowerCase());
                }
            } catch (error) {
                // Without the theme, the splash screen is shown in the system color scheme
            }
        </script>
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" });
            }
        </script>
        <script>
            // A request can stall without failing, which leaves the app starting indefinitely,
            // so a reload is offered if the app did not start within this time. Without a
            // controlling service worker, all resources are downloaded, which can take longer.
            setTimeout(() => {
                const splash = document.getElementById("loading");
                if (!splash || splash.classList.contains("is-fading-out")) {
                    return;
                }
                document.getElementById("splash-hint").classList.remove("is-hidden");
            }, navigator.serviceWorker?.controller ? 10000 : 30000);
        </script>
        <!-- A stylesheet that is still loading blocks the scripts following it -->
        <link rel="stylesheet" href="/main.css" />
    </head>
    <body>
        <div id="loading" data-testid="splash">
            <section class="hero is-fullheight">
                <div class="hero-body">
                    <div class="container has-text-centered">
                        <figure class="image is-128x128 is-inline-block mb-4">
                            <img src="/images/android-chrome-512x512.png" alt="Valens" />
                        </figure>
                        <p class="title is-1 mb-5">Valens</p>
                        <div class="splash-indicator is-visible-with-short-delay">
                            <span class="splash-spinner" role="status" aria-label="Loading app"></span>
                        </div>
                    </div>
                </div>
            </section>
            <div id="splash-hint" class="splash-hint is-hidden has-text-centered has-text-grey px-4">
                <p>The application is taking longer than usual to start.</p>
                <p class="my-4">
                    <button class="button" data-testid="splash-reload" onclick="location.reload()">
                        <span class="icon">
                            <i class="fa fa-arrow-rotate-right"></i>
                        </span>
                        <span>Restart</span>
                    </button>
                </p>
                <p>If restarting does not help, WebAssembly may be disabled or not supported by your browser.</p>
            </div>
        </div>
        <div id="main">
            <!-- {{SCRIPT}} -->
        </div>
    </body>
</html>
