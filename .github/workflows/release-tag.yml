name: Release Tag

# AUTOMATION_TOKEN is a fine-grained PAT (write access to contents) stored as
# an *Actions* secret. GITHUB_TOKEN would not work, as tags pushed with it
# trigger no other workflows and nothing would be published.

on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]

permissions: {}

# Concurrent runs would race for the same tag, letting all but one fail.
concurrency: release-tag

jobs:
  tag_release:
    name: Tag Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.AUTOMATION_TOKEN }}
      - name: Determine Python version
        run: python3 tools/python_versions.py >> $GITHUB_ENV
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync
      - name: Tag
        run: |
          version=$(uv run -- kacl-cli current)
          [ -n "$version" ] || { echo "Error: current version could not be determined" >&2; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            echo "Version $version is already tagged"
            exit 0
          fi
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          # The pushed commit is checked out in detached state, so later
          # commits are excluded. `make tag` expects the main branch.
          git switch -C main
          make tag
          git push origin "v$version"
