name: publishing

on: push

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-24.04

    env:
      CARGO_INCREMENTAL: 0

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Add development environment to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command sh -c 'printf "%s\n" "$PATH"' | tr ':' '\n' | grep '^/nix/store/' >> "$GITHUB_PATH"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Determine version
        run: |
          # Use public version without local version label
          version=$(nix develop --command make version-public | tail -1)
          [ -n "$version" ] || { echo "Error: version could not be determined" >&2; exit 1; }
          echo "SETUPTOOLS_SCM_PRETEND_VERSION=$version" >> "$GITHUB_ENV"
      - name: Check changelog contains tagged version
        if: startsWith(github.ref, 'refs/tags/')
        run: nix develop --command make release-notes VERSION_TAG="${GITHUB_REF_NAME#v}" > /dev/null
      - name: Build distribution
        run: nix develop --command make dist
      - name: Check README
        run: |
          # A release pins the README to its tag, which is pushed by a separate workflow.
          if [[ "$GITHUB_REF" != refs/tags/* ]] \
            && ! grep '^replacement = ' pyproject.toml | grep -qv '/valens/\(blob/\)\?v[0-9]'; then
            echo "README is pinned to a release tag, checked when the tag is built"
            exit 0
          fi
          nix develop --command make check-readme
      - name: Store distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish Python distribution to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-24.04

    environment:
      name: pypi
      url: https://pypi.org/p/valens

    permissions:
      id-token: write

    steps:
      - name: Download dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  test-installation-from-pypi:
    name: Test installation from PyPI
    needs:
      - publish-to-pypi
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7
      - name: Determine Python version
        run: python3 tools/python_versions.py >> "$GITHUB_ENV"
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install from PyPI
        run: |
          # The new version may not be installable immediately after publishing
          version=${GITHUB_REF_NAME#v}
          attempt=0
          until pip install --no-cache-dir "valens==$version"; do
            attempt=$((attempt + 1))
            [ "$attempt" -lt 40 ] \
              || { echo "Error: valens $version is not installable" >&2; exit 1; }
            sleep 15
          done
      - name: Test
        run: |
          installed_version=$(valens --version) \
            || { echo "Error: valens could not be installed from PyPI" >&2; exit 1; }
          [ "$installed_version" = "${GITHUB_REF_NAME#v}" ] \
            || { echo "Error: installed version \"$installed_version\" does not match \"${GITHUB_REF_NAME#v}\"" >&2; exit 1; }

  publish-to-testpypi:
    name: Publish Python distribution to TestPyPI
    if: github.ref == 'refs/heads/main'
    needs:
      - build
    runs-on: ubuntu-24.04

    environment:
      name: testpypi
      url: https://test.pypi.org/p/valens

    permissions:
      id-token: write

    steps:
      - name: Download dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-ghcr:
    name: Publish container image to GitHub Container Registry
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    needs:
      - build
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    env:
      NAME: ghcr.io/${{ github.repository }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Determine Python version
        run: python3 tools/python_versions.py >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          uv sync
      - name: Download distribution packages
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Build image
        run: |
          # Use public version without local version label
          export SETUPTOOLS_SCM_PRETEND_VERSION
          SETUPTOOLS_SCM_PRETEND_VERSION=$(make version-public)
          make -o dist/*.whl container TOOL=docker NAME="$NAME" REVISION="$GITHUB_SHA" SOURCE="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
      - name: Tag image
        run: |
          VERSION="$(make version-public)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            docker tag "$NAME:$VERSION" "$NAME:latest"
          else
            docker tag "$NAME:$VERSION" "$NAME:dev"
          fi
      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        run: |
          docker push --all-tags "$NAME"

  publish-release:
    name: Publish release on GitHub
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - test-installation-from-pypi
      - publish-to-ghcr
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Extract release notes
        run: |
          uvx --from python-kacl kacl-cli get "${GITHUB_REF_NAME#v}" --no-header > release-notes.md
          [ -s release-notes.md ] || { echo "Error: release notes are empty" >&2; exit 1; }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The release may already exist if the workflow is rerun.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
          fi
