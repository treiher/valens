<!-- NOTE: This file is only used by `dx serve` during the development. -->
<!DOCTYPE html>
<html>
    <head>
        <title>{app_title}</title>
        <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="stylesheet" href="/main.css" />
        <meta charset="utf-8" />
        <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="theme-color" content="#48C774" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <script>
            // Apply the configured theme before the first paint, so that the splash screen is
            // not shown in the system color scheme when a different theme is configured
            try {
                const theme = JSON.parse(localStorage.getItem("settings") || "{}").theme;
                if (theme === "Light" || theme === "Dark") {
                    document.documentElement.setAttribute("data-theme", theme.toLowerCase());
                }
            } catch (error) {
                // Without the theme, the splash screen is shown in the system color scheme
            }
        </script>
        <script>
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" });
            }
        </script>
    </head>
    <body>
        <div id="loading" data-testid="splash">
            <section class="hero is-fullheight">
                <div class="hero-body">
                    <div class="container has-text-centered">
                        <figure class="image is-128x128 is-inline-block mb-4">
                            <img src="/images/android-chrome-512x512.png" alt="Valens" />
                        </figure>
                        <p class="title is-1 mb-5">Valens</p>
                        <div class="splash-indicator is-visible-with-short-delay">
                            <span class="splash-spinner" role="status" aria-label="Loading app"></span>
                        </div>
                    </div>
                </div>
            </section>
            <div class="splash-hint is-visible-with-delay has-text-centered has-text-grey px-4">
                If the application does not start, WebAssembly may be disabled or not supported by your browser.
            </div>
        </div>
        <div id="main"></div>
    </body>
</html>
