name: tests

on:
  # Only branches that are pushed to directly. All others are covered by
  # `pull_request`, which would otherwise run a second time per push.
  push:
    branches: [main, next]
  pull_request:
  schedule:
    - cron: '0 2 * * 6'

jobs:
  python_versions:
    name: Python Versions
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.versions.outputs.PYTHON_VERSION }}
      supported: ${{ steps.versions.outputs.PYTHON_VERSIONS }}
    steps:
      - uses: actions/checkout@v7
      - id: versions
        run: python3 tools/python_versions.py >> "$GITHUB_OUTPUT"

  detect_release:
    name: Detect Release
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    needs: python_versions
    outputs:
      adds_release: ${{ steps.detect.outputs.ADDS_RELEASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.python_versions.outputs.latest }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync
      - id: detect
        run: |
          git show ${{ github.event.pull_request.base.sha }}:CHANGELOG.md > "$RUNNER_TEMP/base_changelog.md"
          base=$(uv run -- kacl-cli -f "$RUNNER_TEMP/base_changelog.md" current)
          head=$(uv run -- kacl-cli current)
          { [ -n "$base" ] && [ -n "$head" ]; } || { echo "Error: current version could not be determined" >&2; exit 1; }
          echo "Current version: $base (base), $head (head)"
          [ "$base" = "$head" ] || echo "ADDS_RELEASE=true" >> "$GITHUB_OUTPUT"

  check_project:
    name: Project Checks
    runs-on: ubuntu-24.04
    needs: python_versions
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.python_versions.outputs.latest }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync
      - name: Check
        run: |
          nix shell --inputs-from . nixpkgs#actionlint --command make check-project

  check_frontend:
    name: Frontend Checks
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Add development environment to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command sh -c 'printf "%s\n" "$PATH"' | tr ':' '\n' | grep '^/nix/store/' >> "$GITHUB_PATH"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Check
        run: nix develop --command make check-frontend

  check_backend:
    name: Backend Checks
    runs-on: ubuntu-24.04
    needs: python_versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python_versions.outputs.supported) }}
        target: [ruff-format, ruff, mypy]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync
      - name: Check
        run: |
          make check-${{ matrix.target }}

  check_screenshots:
    name: Screenshot Checks
    if: ${{ needs.detect_release.outputs.adds_release == 'true' }}
    runs-on: ubuntu-24.04
    needs: detect_release
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Add development environment to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command sh -c 'printf "%s\n" "$PATH"' | tr ':' '\n' | grep '^/nix/store/' >> "$GITHUB_PATH"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Check
        run: nix develop --command make check-screenshots

  test_installation:
    name: Installation Test
    runs-on: ubuntu-24.04
    needs: python_versions
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python_versions.outputs.supported) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Determine dioxus-cli version
        run: |
          version=$(sed -n '/^name = "dioxus"$/{n; s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          [ -n "$version" ] || { echo "Error: dioxus version could not be determined" >&2; exit 1; }
          echo "DIOXUS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dioxus-cli
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: dioxus-cli@${{ env.DIOXUS_VERSION }}
      - name: Install Sass
        run: npm install -g sass
      - name: Test
        run: |
          make test-installation

  test_frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Add development environment to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command sh -c 'printf "%s\n" "$PATH"' | tr ':' '\n' | grep '^/nix/store/' >> "$GITHUB_PATH"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Test
        run: nix develop --command make test-frontend

  test_backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    needs: python_versions
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.python_versions.outputs.supported) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          uv sync
      - name: Test
        run: |
          make test-backend

  test_e2e:
    name: End-to-End Tests (Chromium)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Add development environment to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command sh -c 'printf "%s\n" "$PATH"' | tr ':' '\n' | grep '^/nix/store/' >> "$GITHUB_PATH"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Test
        run: nix develop --command make test-e2e DEVICE="Pixel 7"
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  test_e2e_firefox:
    name: End-to-End Tests (Firefox)
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Add development environment to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command sh -c 'printf "%s\n" "$PATH"' | tr ':' '\n' | grep '^/nix/store/' >> "$GITHUB_PATH"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Test
        run: nix develop --command make test-e2e BROWSER=firefox
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-firefox
          path: test-results/

  # The Nix development environment is defined for Linux only, so the dependencies are installed
  # individually here. WebKit is only provided as the WPE port on Linux, which requires a display.
  test_e2e_webkit:
    name: End-to-End Tests (WebKit)
    runs-on: macos-15
    needs: python_versions
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.python_versions.outputs.latest }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Determine dioxus-cli version
        run: |
          version=$(sed -n '/^name = "dioxus"$/{n; s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)
          [ -n "$version" ] || { echo "Error: dioxus version could not be determined" >&2; exit 1; }
          echo "DIOXUS_VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dioxus-cli
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: dioxus-cli@${{ env.DIOXUS_VERSION }}
      - name: Install Sass
        run: npm install -g sass
      - name: Install dependencies
        run: |
          uv sync
      - name: Install Playwright browsers
        run: uv run -- playwright install webkit
      - name: Test
        run: make test-e2e BROWSER=webkit DEVICE="iPhone 15"
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-webkit
          path: test-results/

  test_latest_dependencies:
    name: Latest Dependencies
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    env:
        PYTHON_VERSION: "3.x"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov, Nextest and dioxus-cli
        uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-llvm-cov,nextest,dioxus-cli
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Install dependencies
        run: |
          uv lock --upgrade
          uv sync
          cargo update
      - name: Install Sass
        run: npm install -g sass
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('uv.lock') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run -- playwright install --with-deps --no-shell chromium
      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run -- playwright install-deps chromium
      - name: Test
        run: |
          make test
      - name: Upload Playwright traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-latest
          path: test-results/

  test_latest_release:
    name: Latest Release
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    needs: python_versions
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ needs.python_versions.outputs.latest }}
      - name: Install latest PyPI release
        run: |
          pip install valens
      - name: Test
        run: |
          valens --version
