name: Release PR

# AUTOMATION_TOKEN is a fine-grained PAT (write access to contents and pull
# requests) stored as an *Actions* secret. GITHUB_TOKEN would not work, as
# neither its pushes nor the pull requests it creates trigger other workflows,
# so the release would not be checked before being merged.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: 'Version increment'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions: {}

jobs:
  create_release_pr:
    name: Create Release PR
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: 0
      INCREMENT: ${{ inputs.increment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.AUTOMATION_TOKEN }}
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
      - name: Add development environment to PATH
        run: |
          # shellcheck disable=SC2016
          nix develop --command sh -c 'printf "%s\n" "$PATH"' | tr ':' '\n' | grep '^/nix/store/' >> "$GITHUB_PATH"
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ hashFiles('flake.lock') }}
          cache-on-failure: true
      - name: Determine release version
        run: |
          version=$(nix develop --command uv run -- kacl-cli next "$INCREMENT" | tail -1)
          echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "Error: release version could not be determined: $version" >&2; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create release commit
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR_ID+$GITHUB_ACTOR@users.noreply.github.com"
          git switch -c "release/$VERSION"
          nix develop --command make release RELEASE_VERSION="$VERSION"
      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
        run: |
          git push -u origin HEAD
          nix develop --command make release-notes VERSION_TAG="$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh pr create --base main --title "Release $VERSION" --body-file "$RUNNER_TEMP/release-notes.md"
